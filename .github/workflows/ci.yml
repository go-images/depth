name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A workflow that fails to PARSE reports nothing at all -- no red cross, no
  # run, just silence that reads exactly like success. actionlint is the only
  # thing that catches it, so it is the first lane here.
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"; echo "$unformatted"
            exit 1
          fi
      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod

  # Nothing here is platform-specific, so nothing gets a pass for being one:
  # the same tests, the same coverage gate, on all three.
  test:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: CGO_ENABLED=0 go vet ./...
        shell: bash
      - run: CGO_ENABLED=0 go test -count=1 -coverprofile=cover.out ./...
        shell: bash
      # Rows are synthesised in parallel and the whole design rests on their
      # being independent. The race detector is what says so.
      - run: CGO_ENABLED=1 go test -race -count=1 ./...
        shell: bash
      # This package is portable through and through, so there is no part of it
      # a build machine cannot reach and no excuse for less than everything.
      - name: 100% coverage
        shell: bash
        run: |
          go tool cover -func=cover.out | tee cov.txt
          if grep -v '100.0%' cov.txt; then
            echo "::error::the lines above are below 100%"; exit 1
          fi

  cross:
    name: cross ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # All six of Go's 64-bit architectures, then the rest -- including
          # wasm, which is a real target for this: a browser has no GPU binding
          # and no Neural Engine, and this package is the whole answer there.
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: riscv64 }
          - { goos: linux, goarch: loong64 }
          - { goos: linux, goarch: ppc64le }
          - { goos: linux, goarch: s390x }
          - { goos: windows, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: freebsd, goarch: amd64 }
          - { goos: js, goarch: wasm }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build ./...
      - run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go vet ./...
